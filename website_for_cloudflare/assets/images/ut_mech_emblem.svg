<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <radialGradient id="emblemGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#14244d"/>
      <stop offset="70%" stop-color="#0d1730"/>
      <stop offset="100%" stop-color="#060c1d"/>
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="30%" stop-color="#d4af37"/>
      <stop offset="70%" stop-color="#b48318"/>
      <stop offset="100%" stop-color="#fef08a"/>
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Outer Ring with Classical Border -->
  <circle cx="250" cy="250" r="240" fill="url(#emblemGrad)" stroke="url(#goldGrad)" stroke-width="4"/>
  <circle cx="250" cy="250" r="230" fill="none" stroke="#d4af37" stroke-width="1.5" stroke-dasharray="4 3"/>
  <circle cx="250" cy="250" r="175" fill="none" stroke="url(#goldGrad)" stroke-width="2.5"/>

  <!-- Inscribed Text Path Outer -->
  <path id="textCircleTop" d="M 60,250 A 190,190 0 0,1 440,250" fill="none"/>
  <path id="textCircleBottom" d="M 440,250 A 190,190 0 0,1 60,250" fill="none"/>

  <!-- Circular Inscribed Typography -->
  <text fill="#fef08a" font-family="'Cinzel', 'Times New Roman', serif" font-size="19" font-weight="700" letter-spacing="3.5">
    <textPath href="#textCircleTop" startOffset="50%" text-anchor="middle">
      UNIVERSITY OF TEHRAN &bull; EST. 1934
    </textPath>
  </text>
  <text fill="#cbd5e1" font-family="'Inter', sans-serif" font-size="14.5" font-weight="600" letter-spacing="2.2">
    <textPath href="#textCircleBottom" startOffset="50%" text-anchor="middle">
      DEPARTMENT OF MECHANICAL ENGINEERING
    </textPath>
  </text>

  <!-- Decorative Stars on Ring -->
  <polygon points="432,250 435,257 442,257 437,262 439,269 432,265 425,269 427,262 422,257 429,257" fill="#d4af37"/>
  <polygon points="68,250 71,257 78,257 73,262 75,269 68,265 61,269 63,262 58,257 65,257" fill="#d4af37"/>

  <!-- Inner Center Shield / Core -->
  <circle cx="250" cy="250" r="160" fill="#091226" stroke="#d4af37" stroke-width="2"/>

  <!-- Mechanical Engineering Gear Teeth Pattern (16 Teeth) -->
  <g id="gearTeeth" stroke="url(#goldGrad)" stroke-width="2" fill="none" opacity="0.45">
    <circle cx="250" cy="250" r="148" stroke-dasharray="14 15" stroke-width="10"/>
  </g>

  <!-- Iconic Sasanian Wings & University of Tehran Historical Gate Motif -->
  <!-- Wing Left -->
  <path d="M 250,225 C 210,180 160,185 130,220 C 145,215 165,225 185,245 C 160,250 145,270 140,295 C 165,280 195,280 220,290 C 235,275 245,255 250,225 Z" 
        fill="url(#goldGrad)" opacity="0.9" stroke="#b48318" stroke-width="1"/>
  <!-- Wing Right -->
  <path d="M 250,225 C 290,180 340,185 370,220 C 355,215 335,225 315,245 C 340,250 355,270 360,295 C 335,280 305,280 280,290 C 265,275 255,255 250,225 Z" 
        fill="url(#goldGrad)" opacity="0.9" stroke="#b48318" stroke-width="1"/>

  <!-- Central Torch of Knowledge & Open Book -->
  <path d="M 235,145 L 265,145 L 255,195 L 245,195 Z" fill="#f59e0b"/>
  <ellipse cx="250" cy="135" rx="12" ry="20" fill="#fef08a" filter="url(#goldGlow)"/>
  <ellipse cx="250" cy="138" rx="6" ry="12" fill="#ef4444"/>

  <!-- Open Academic Codex (Engineering Book) -->
  <path d="M 250,305 L 195,285 C 180,280 170,290 170,305 L 170,350 C 185,340 215,340 250,355 C 285,340 315,340 330,350 L 330,305 C 330,290 320,280 305,285 Z" 
        fill="#111f44" stroke="#d4af37" stroke-width="2.5"/>
  <path d="M 250,305 L 250,355" stroke="#d4af37" stroke-width="2.5"/>
  <!-- Book Page Lines -->
  <line x1="185" y1="305" x2="235" y2="318" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="185" y1="318" x2="235" y2="331" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="265" y1="318" x2="315" y2="305" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="265" y1="331" x2="315" y2="318" stroke="#94a3b8" stroke-width="1.5"/>

  <!-- Persian Inscription at Center Base: دانشکده مهندسی مکانیک -->
  <rect x="155" y="375" width="190" height="32" rx="4" fill="#0b142b" stroke="#d4af37" stroke-width="1.5"/>
  <text x="250" y="397" fill="#fef08a" font-family="'Tahoma', 'Vazirmatn', 'Arial', sans-serif" font-size="14.5" font-weight="bold" text-anchor="middle">
    دانشکده مهندسی مکانیک
  </text>
</svg>